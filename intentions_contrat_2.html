margin: 0;
padding: 0;

height: 100%;

/* ================
Stlye de la boite de zoom par arrondissement
================== */
.zoomPanel {

    border-radius: 5px;

/* =========================================
   LÉGENDE DU PANNEAU
   ========================================= */

    margin-top: 10px;
    margin-bottom: 5px;
    font-weight: bold;
    font-size: 11px;
    color: #555555;
}

.legendeCase {
    display: block;
    margin: 4px 0;
    cursor: pointer;
    font-size: 13px;
}

.legendeCase input {
    margin-right: 6px;

}


/* =========================================
   SOUS-CATÉGORIES CONTRACTUALISATION
   ========================================= */

.legendeSousCategorie {
    margin-left: 24px;
    margin-top: 3px;
    font-size: 12px;
}

.legendeEntete {
    display: flex;
    align-items: center;
    gap: 4px;
}

/* Petite flèche */
.legendeToggle {
    border: none;
    background: transparent;
    padding: 2px 4px;
    cursor: pointer;
    font-size: 11px;
    color: #555;

/* Case à cocher dans l'en-tête */

    margin: 4px 0;
}

/* Détails repliés par défaut */
.legendeDetails {
    display: none;
}

   PASTILLES DE COULEUR
   ========================================= */

.pastille {
    display: inline-block;
    width: 11px;
    height: 11px;
    margin-right: 6px;
    border-radius: 50%;
    vertical-align: -1px;
}


/* -----------------contractualisation ---------------------------------------*/

.pastillePVD {
    background: #9842b7;
}

.pastilleACV {
    background: #ff9a3b;
}

.pastilleVA {
    background: #07b3e3;
}

.pastilleInteressees {
display: inline-block;
width: 14px;
height: 9px;
margin-right: 6px;
background: #d6d0ea;
border-radius: 1px;
vertical-align: -1px;
} 

/*------------------------------------------- réseau d’alerte-------------------------------------*/

.pastilleAlerte {
display: inline-block;
width: 14px;
height: 9px;
margin-right: 6px;
background: transparent;
border: 2px solid #e31a00;
box-sizing: border-box;
border-radius: 1px;
vertical-align: -1px;
}

/*------------------------------------------- suivi-------------------------------------*/

   PASTILLES DE COULEUR DU SUIVI
   ========================================= */

}

.pastilleSuiviSecondRDV {
    background: #fed86e;
}

.pastilleSuiviElaboration {
    background: #ffff68;
}

.pastilleSuiviFinalise {
    background: #99d75c;
}

.pastilleSuiviSigne {
    background: #33af2c;
}

/* =========================================
 PASTILLES DE COULEUR DU SUIVI PCS
 ========================================= */



.pastillePCSMarron {
 background: #810000;
}

.pastillePCSRouge {

.pastillePCSViolet {

.pastillePCSBleu {

.pastillePCSOrange {
    background: #ffb23b;
}

.pastillePCSJaune {

.zoomPanelTitle {
 cursor: pointer;
 font-weight: bold;
 user-select: none;

.zoomArrow {

 width: 14px;

.zoomPanelButtons {
margin-top: 6px;
}

.grilleZoom {

grid-template-columns: 1fr 1fr;
gap: 6px;
margin-left: 20px;
margin-top: 6px;
}

.zoomPanel button {
display: block;
width: 100%;
box-sizing: border-box;
margin: 0;
padding: 5px 6px;

 <div class="legendeEntete">

checked>

    L.DomEvent.disableClickPropagation(div);

// Gestion des rubriques repliables de la légende
div.querySelectorAll(".legendeToggle").forEach(function(fleche) {

    fleche.addEventListener("click", function() {

        // On récupère la rubrique associée à la flèche
        const cible = div.querySelector(
            "#" + fleche.getAttribute("data-cible")
        );

        // On vérifie si la rubrique est déjà ouverte

        cible.style.display = estOuverte ? "none" : "block";

        fleche.textContent = estOuverte ? "▶" : "▼";

});

    const titre = div.querySelector(".zoomPanelTitle");
const boutons = div.querySelector(".zoomPanelButtons");

boutons.style.display = "none";

const chkContractualisation =
    div.querySelector("#chkContractualisation");

chkContractualisation.addEventListener("change", function() {

    afficherContractualisation =
        chkContractualisation.checked;

    if (communesPoints) {

        communesPoints.eachLayer(function(layer) {

            const style =
                styleCommunes_points(layer.feature);

            if (layer.setStyle) {

            }

        });

});

const chkSuiviVisiteContrat =
    div.querySelector("#chkSuiviVisiteContrat");

chkSuiviVisiteContrat.addEventListener("change", function() {

    if (coucheSuiviVisiteContrat) {

        if (chkSuiviVisiteContrat.checked) {

        } else {

});

/* =========================================
   ACTIVATION / DESACTIVATION DU SUIVI PCS
   ========================================= */

const chkSuiviPCS =
    div.querySelector("#chkSuiviPCS");

chkSuiviPCS.addEventListener("change", function() {

        if (chkSuiviPCS.checked) {

            coucheSuiviPCS.addTo(map);

        } else {

        }

    }

});


const chkCommunes_interessees =
    div.querySelector("#chkCommunes_interessees");

chkCommunes_interessees.addEventListener("change", function() {

    if (coucheCommunesInteressees) {

        if (chkCommunes_interessees.checked) {

            coucheCommunesInteressees.addTo(map);

        } else {

            map.removeLayer(coucheCommunesInteressees);

        }

    }

});



const chkCommune_reseau_d_alerte =
    div.querySelector("#chkCommune_reseau_d_alerte");

chkCommune_reseau_d_alerte.addEventListener("change", function() {

    if (coucheReseauAlerte) {

        if (chkCommune_reseau_d_alerte.checked) {

            coucheReseauAlerte.addTo(map);

        } else {

            map.removeLayer(coucheReseauAlerte);

});





titre.addEventListener("click", function() {

};

controleZoom.addTo(map);

/* =========================================
 DONNÉES GRIST
 ========================================= */

let contractualisationParCommune = {};
let communesInteressees = {};
let communesReseauAlerte = {};
let informationsCommunes = {};
let suiviVisiteContrat = {};
let suiviPCS = {};

let coucheCommunes = null;
let coucheCommunesInteressees = null;
let coucheReseauAlerte = null;
let coucheSuiviVisiteContrat = null;
let coucheArrondissements = null;
let communesPoints = null;
let coucheSuiviPCS = null;


/* =========================================
   FILTRES DE LA LÉGENDE
   ========================================= */

let afficherContractualisation = true;
/* =========================================
 TEST DES DONNÉES GRIST
 ========================================= */

console.log("TEST API GRIST :", typeof grist);

  const texte = String(valeur || "").trim().toUpperCase();

  if (texte === "X") {
    return "Oui";
  }

  if (texte === "") {
    return "Non";
  }

  return "";
}

code,

alerte);

pcs : pcs

 });

 console.log(
 "TABLEAU DES CONTRACTUALISATIONS :",
contractualisationParCommune,

 );

 coucheCommunes.setStyle(styleCommune);

 });



/* =========================================
STYLE DES POLYGONES DES COMMUNES contour gris
 ========================================= */

function styleCommune(feature) {

  return {
    fillColor: "#ffffff",
    fillOpacity: 0,
    color: "#959595",
    weight: 0.5
  };

}
/* =========================================
STYLE DES COMMUNES INTERESSEES
 ========================================= */

function styleCommunesInteressees(feature) {

  const code = String(
    feature.properties.INSEE_COMM || ""
  ).trim();

  const interessee =
    String(
      communesInteressees[code] || ""
    ).trim().toUpperCase();

  if (interessee === "X") {

    return {
      fillColor: "#d6d0ea",
      fillOpacity: 0.8,
      color: "transparent",
      weight: 0
    };

  }

  return {
    fillColor: "#ffffff",
    fillOpacity: 0,
    color: "transparent",
    weight: 0
  };

}

/* =========================================
STYLE DES COMMUNES RESEAU ALERTE
 ========================================= */

function styleReseauAlerte(feature) {

  const code = String(
    feature.properties.INSEE_COMM || ""
  ).trim();

  const alerte =
    String(
      communesReseauAlerte[code] || ""
    ).trim().toUpperCase();

  if (alerte === "X") {

    return {
      fillOpacity: 0,
      color: "#e31a00",
      weight: 2
    };

  }

  return {
    fillOpacity: 0,
    color: "transparent",
    weight: 0
  };

}
/* =========================================
STYLE DU SUIVI
 ========================================= */
function styleSuiviVisiteContrat(feature) {

  const code = String(
    feature.properties.INSEE_COMM || ""
  ).trim();

  const suivi =
    String(
      suiviVisiteContrat[code] || ""
    ).trim().toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
// 1er RDV réalisé
 if (suivi === "1er rdv realise") {
 return {
 fillColor: "#fdb14e",
 fillOpacity: 0.8,
 color: "transparent",
 weight: 0
 };
 }

  // 2nd RDV réalisé
  if (suivi === "2nd rdv realise") {
    return {
      fillColor: "#fed86e",
      fillOpacity: 0.8,
      color: "transparent",
      weight: 0
    };
  }

 // Elaboration en cours
 if (suivi === "elaboration en cours") {
 return {
 fillColor: "#ffff68",
 fillOpacity: 0.8,
 color: "transparent",
 weight: 0
 };
 }

// Contrat finalisé
 if (suivi === "contrat finalise") {
 return {
 fillColor: "#99d75c",
 fillOpacity: 0.8,
 color: "transparent",
 weight: 0
 };
 }

 // Contrat signé
 if (suivi === "contrat signe") {
 return {
 fillColor: "#33af2c",
 fillOpacity: 0.8,
 color: "transparent",
 weight: 0
 };
 }


  // Aucun suivi renseigné
  return {
    fillColor: "#ffffff",
    fillOpacity: 0,
    color: "transparent",
    weight: 0
  };
}

/* =========================================
   STYLE DU SUIVI PCS
   ========================================= */

function normaliserPCS(valeur) {

    return String(valeur || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ");
}

function styleSuiviPCS(feature) {

    const code = String(feature.properties.INSEE_COMM || "").trim();
    const statut = normaliserPCS(suiviPCS[code]);

    const couleursPCS = {

        // PCS à jour : toujours vert
        "pcs a jour priorite tres forte": "#23c720",
        "pcs a jour priorite forte": "#23c720",
        "pcs a jour priorite moderee": "#23c720",

        // PCS non réalisé
        "pcs non realise priorite tres forte": "#810000",
        "pcs non realise priorite forte": "#c50000",
        "pcs non realise priorite moderee": "#e3393b",

        // PCS non à jour
        "pcs non a jour priorite tres forte": "#ff7f00",
        "pcs non a jour priorite forte": "#ffb23b",
        "pcs non a jour priorite moderee": "#ffff68"
    };

    const couleur = couleursPCS[statut];

    if (couleur) {
        return {
            fillColor: couleur,
            fillOpacity: 0.8,
            color: "transparent",
            weight: 0
        };
    }

    return {
        fillColor: "#ffffff",
        fillOpacity: 0,
        color: "transparent",
        weight: 0
    };
}


/* =========================================
 contractualisation (pastille au centre de la commune)
 ========================================= */

function styleCommunes_points(feature) {

 const code = String(
 feature.properties.INSEE_COMM || ""
 ).trim();


 /* =========================================
 CONTRACTUALISATION
 ========================================= */

 const contractualisation =
 String(
 contractualisationParCommune[code] || ""
 ).trim().toUpperCase();


 /* =========================================
 COULEUR DE LA PASTILLE
       ========================================= */

    let couleur = "#ffffff";
    let afficher = false;


   if (afficherContractualisation && contractualisation === "PVD") {

    couleur = "#9842b7";

    afficher = true;

}

else if (afficherContractualisation && contractualisation === "ACV") {

    couleur = "#ff9a3b";

    afficher = true;

}

else if (afficherContractualisation && contractualisation === "VA") {

    couleur = "#07b3e3";

    afficher = true;

}


    /* =========================================
       AFFICHAGE DE LA PASTILLE
       ========================================= */

    if (afficher) {

        return {

            radius: 4,

            color: couleur,
            weight: 2,

            fillColor: couleur,
            fillOpacity: 1

        };

    }


    /* =========================================
       PAS DE CONTRACTUALISATION
       ========================================= */

    return {

        radius: 0,

        color: "#ffffff",
        weight: 0,

        fillColor: "#ffffff",
        fillOpacity: 0

    };
}


/* =========================================
   BADGE COLORÉ DU STADE DE SUIVI
   ========================================= */

function creerBadgeSuivi(suivi) {

    const stade = String(suivi || "").trim();

    const stadeNormalise = stade
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

    let couleur = "#eeeeee";

    if (stadeNormalise === "1er rdv realise") {
        couleur = "#fdb14e";
    }
    else if (stadeNormalise === "2nd rdv realise") {
        couleur = "#fed86e";
    }
    else if (stadeNormalise === "elaboration en cours") {
        couleur = "#ffff68";
    }
    else if (stadeNormalise === "contrat finalise") {
        couleur = "#99d75c";
    }
    else if (stadeNormalise === "contrat signe") {
        couleur = "#33af2c";
    }

    const texte = stade || "Non renseigné";

    return `
        <span style="
            display: inline-block;
            background-color: ${couleur};
            color: #222222;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 3px;
            margin-bottom: 5px;
        ">
            ${texte}
        </span>
    `;
}


/* =========================================
 COUCHE COMMUNES
 ========================================= */

fetch(urlCommunes)
.then(function(response) {
 return response.json();
})
.then(function(data) {

coucheCommunes = L.geoJSON(data, {

    style: styleCommune,

    pane: "communesPane",

onEachFeature: function(feature, layer) {

    const code = String(
        feature.properties.INSEE_COMM || ""
    ).trim();

    layer.on("click", function() {

        const infos = informationsCommunes[code];

        if (!infos) {
            return;
        }


        /* =========================================
           TEXTE COURT / TEXTE COMPLET
           ========================================= */

        function afficherTexteLong(id, texte, longueur = 100) {

            if (!texte) {
                return "";
            }

            /* Texte court : on affiche tout */
            if (texte.length <= longueur) {

                return `
                    <div class="texteLong">
                        ${texte}
                    </div>
                `;

            }


            /* Texte long : création de l'aperçu */

            const extrait = texte.substring(0, longueur);

            const positionFinPhrase = Math.max(
                extrait.lastIndexOf("."),
                extrait.lastIndexOf("!"),
                extrait.lastIndexOf("?")
            );

            let apercu;


            if (positionFinPhrase > 40) {

                apercu =
                    extrait.substring(
                        0,
                        positionFinPhrase + 1
                    );

            } else {

                apercu =
                    extrait.substring(
                        0,
                        extrait.lastIndexOf(" ")
                    ) + "...";

            }


            return `
                <div class="texteLong">

                    <span class="texteApercu">
                        ${apercu}
                    </span>

                    <span
                        class="texteComplet"
                        style="display:none;"
                    >
                        ${texte}
                    </span>

                    <a
                        href="#"
                        class="lienMore"
                        onclick="
                            event.preventDefault();

                            const bloc = this.parentElement;

                            const apercu =
                                bloc.querySelector('.texteApercu');

                            const complet =
                                bloc.querySelector('.texteComplet');

                            if (complet.style.display === 'none') {

                                apercu.style.display = 'none';
                              complet.style.display = 'block';
                                this.textContent = 'moins';

                            } else {

                                apercu.style.display = 'inline';
                                complet.style.display = 'none';
                                this.textContent = 'plus';

                            }

                            return false;
                        "
                    >
                        plus
                    </a>

                </div>
            `;

        }


        /* =========================================
           CONTENU DU POPUP
           ========================================= */

        const contenu = `

            <div class="titreCommune">
                ${infos.commune}
            </div>

            <div class="infosCommune">

                <strong>Nom :</strong>
                ${infos.nom}<br>

                <strong>Prénom :</strong>
                ${infos.prenom}<br>

                <strong>EPCI :</strong>
                ${infos.epci}<br>

<strong>Stade de suivi du contrat :</strong><br>
${creerBadgeSuivi(infos.suivi)}<br>

<strong>Suivi du PCS :</strong><br>
${infos.pcs || "Non renseigné"}<br><br>


            </div>
        `;


        /* =========================================
           OUVERTURE DU POPUP
           ========================================= */

        layer.bindPopup(contenu, {

            className: "popupCommune",

            pane: "popupPane"

        }).openPopup();

    });

}

}).addTo(map);

/* =========================================

   ========================================= */

function gererEtiquettesCommunes() {

    if (!communesPoints) {
        return;
    }

    communesPoints.eachLayer(function(layer) {

        if (map.getZoom() >= 10) {

            layer.openTooltip();

        } else {

            layer.closeTooltip();

        }

    });

}

pane: "arrondissementPane",

        }
    });

       BOUTONS DE ZOOM
       ========================================= */

    /* On récupère l'emprise de chaque arrondissement
       grâce à INSEE_ARR */

    data.features.forEach(function(feature) {

        const code = String(
            feature.properties.INSEE_ARR || ""
        ).trim();

        const couche = L.geoJSON(feature);

        if (code === "1") {
            limitesArrondissements.avranches =
                couche.getBounds();
        }

        else if (code === "2") {
            limitesArrondissements.cherbourg =
                couche.getBounds();
        }

        else if (code === "3") {
            limitesArrondissements.coutances =
                couche.getBounds();
        }

        else if (code === "4") {
            limitesArrondissements.saintlo =
                couche.getBounds();
        }

    });


    /* =========================================
       MANCHE
       ========================================= */

    document.getElementById("zoomManche")
        .addEventListener("click", function() {

            map.fitBounds(
                coucheArrondissements.getBounds(),

                }
            );
