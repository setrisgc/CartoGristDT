<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Carte des intentions de contractualisations</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100%;
}


/* =========================================
   ÉTIQUETTES DES COMMUNES
   ========================================= */

.labelCommune {

    background: transparent !important;
    border: none !important;
    box-shadow: none !important;

    color: #555555;

    font-size: 10px;
    font-weight: normal;

    white-space: nowrap;

    padding: 0;

    transform: translate(-50%, -50%);

}


</style>

</head>


<body>

<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================
   GEOJSON
   ========================================= */

const urlCommunes =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/communes.geojson";

const urlArrondissements =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/arrondissement.geojson";

const urlCommunesPoints = "https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/communes_points.geojson"; 


/* =========================================
   CARTE
   ========================================= */

const map = L.map("map", {

    center: [49.1, -1.3],

    zoom: 8

});


/* =========================================
   FOND IGN
   ========================================= */

const fond = L.tileLayer(
    'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&FORMAT=image/png&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}',
    {
        maxZoom:22,
        maxNativeZoom:19,
		   opacity:0.7,
        attribution:'© IGN - Géoplateforme'
    }
);

fond.addTo(map);

/* =========================================
   COUCHE COMMUNES
   ========================================= */

fetch(urlCommunes)

.then(function(response) {

    return response.json();

})

.then(function(data) {

    const communes = L.geoJSON(data, {

        style: {

            color: "#b6b6b6",

            weight: 1,

            fill: false

        }

    });


    communes.addTo(map);


/* pour les centroides des communes qui servent aux étiquettes */
/* =========================================
   POINTS DES COMMUNES
   ========================================= */

return fetch(urlCommunesPoints)

.then(function(response) {

    return response.json();

})

.then(function(data) {

    const communesPoints = L.geoJSON(data);

    communesPoints.addTo(map);

});




    /* =========================================
       UNE FOIS LES COMMUNES CHARGÉES,
       ON CHARGE LES ARRONDISSEMENTS
       ========================================= */

    return fetch(urlArrondissements);

})

.then(function(response) {

    return response.json();

})

.then(function(data) {

    const arrondissements = L.geoJSON(data, {

        style: {

            color: "#141f72",

            weight: 3,

            fill: false

        }

    });


    arrondissements.addTo(map);

});


</script>

</body>

</html>
