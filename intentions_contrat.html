<!DOCTYPE html>

<html lang="fr"> 

<head> 

<meta charset="UTF-8"> 

<title>Carte des intentions de contractualisations</title> 

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>


html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
}

#map {
 width: 100%;
 height: 100%;
}

.labelCommune {
 background: transparent !important;
 border: none !important;
 box-shadow: none !important;
 color: #555555;
 font-size: 6px;
 font-weight: normal;
 white-space: nowrap;
 padding: 0;
 text-align: center;
 line-height: 20px;
 pointer-events: none;
}

/* pour la boite de zoom par arrondissement */
.zoomPanel {
    background: white;
    padding: 8px;
    border-radius: 5px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.35);
    font-size: 13px;
}

.zoomPanelTitle {
    cursor: pointer;
    font-weight: bold;
    user-select: none;
}

.zoomPanelButtons {
    margin-top: 6px;
}

.zoomPanel button {
    display: block;
    width: 120px;
    margin: 3px 0;
    padding: 4px 6px;
    border: 1px solid #cccccc;
    background: white;
    cursor: pointer;
    border-radius: 3px;
    text-align: left;
}

.zoomPanel button:hover {
    background: #eeeeee;
}


</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<script>

grist.ready({
    requiredAccess: "read table"
});


/* =========================================
   GEOJSON
   ========================================= */

const urlCommunes =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/communes.geojson";

const urlArrondissements =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/arrondissement.geojson";

const urlCommunesPoints =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/communes_points.geojson";


/* =========================================
   CARTE
   ========================================= */

const map = L.map("map", {
    center: [49.1, -1.3],
    zoom: 8
});


/* =========================================
   PANES CARTOGRAPHIQUES
   ========================================= */

map.createPane("communesPane");
map.getPane("communesPane").style.zIndex = 350;


/* Arrondissements */
map.createPane("arrondissementPane");
map.getPane("arrondissementPane").style.zIndex = 500;


/* Points des communes */
map.createPane("communesPointsPane");
map.getPane("communesPointsPane").style.zIndex = 1000;


/* Étiquettes des communes */
map.createPane("communesLabelsPane");
map.getPane("communesLabelsPane").style.zIndex = 1100;


/* =========================================
   BOÎTE DE ZOOM PAR ARRONDISSEMENT
   ========================================= */

const controleZoom = L.control({
    position: "topright"
});

controleZoom.onAdd = function() {

    const div = L.DomUtil.create("div", "zoomPanel");

div.innerHTML = ` <div class="zoomPanelTitle"> 📍 Zoom par arrondissement </div> <div class="zoomPanelButtons"> <button id="zoomManche"> Manche </button> <button id="zoomCherbourg"> Cherbourg </button> <button id="zoomCoutances"> Coutances </button> <button id="zoomSaintLo"> Saint-Lô </button> <button id="zoomAvranches"> Avranches </button> </div> `; 

 L.DomEvent.disableClickPropagation(div);

const titre = div.querySelector(".zoomPanelTitle");
const boutons = div.querySelector(".zoomPanelButtons");

titre.addEventListener("click", function() {

    if (boutons.style.display === "none") {

        boutons.style.display = "block";

    } else {

        boutons.style.display = "none";

    }

});

    return div;
};

controleZoom.addTo(map);


/* =========================================
   DONNÉES GRIST
   ========================================= */

let contractualisationParCommune = {};
let communesInteressees = {};
let communesReseauAlerte = {};
let coucheCommunes = null;
let coucheArrondissements = null;
let communesPoints = null;


/* =========================================
 TEST DES DONNÉES GRIST
 ========================================= */

console.log("TEST API GRIST :", typeof grist);

grist.onRecords(function(records) {

 console.log("NOMBRE DE LIGNES GRIST :", records.length);

contractualisationParCommune = {};
communesInteressees =  {};
communesReseauAlerte =  {};

 records.forEach(function(record) {
	const code = String(record["Code_Commune"] || "").trim();
	const valeur = String(record["Contractualisation"] || "").trim();
	const interessee = String(record["Communes_interessees"] || "").trim();
	const alerte  = String(record["Commune_reseau_d_alerte"] || "").trim();

console.log(
"COMMUNE :",
code,
"VALEUR BRUTE :",
interessee,
"TYPE :",
typeof interessee,
alerte); 

 if (code) {

contractualisationParCommune[code] = valeur;
communesInteressees[code]= interessee ;
communesReseauAlerte[code]= alerte ;
 }

 });

 console.log(
 "TABLEAU DES CONTRACTUALISATIONS :",
contractualisationParCommune,
communesInteressees,
communesReseauAlerte
 );

if (coucheCommunes) {

    coucheCommunes.setStyle(styleCommune);

}

if (communesPoints) {

    communesPoints.eachLayer(function(layer) {

        if (layer.setStyle) {

            layer.setStyle(
                styleCommunes_points(layer.feature)
            );

        }

    });

}

}); 

/* =========================================
COLORATION DES COMMUNES EN FONCTION CONTRACTUALISATION
 ========================================= */

function styleCommune(feature) {

 const code = String(
 feature.properties.INSEE_COMM || ""
 ).trim();

 const contractualisation =
 contractualisationParCommune[code] || "";

 let couleur = "#ffffff";

 if (contractualisation === "PVD") {

 couleur = "#9842b7";

 }
 else if (contractualisation === "ACV") {

        couleur = "#ff9a3b";

    }
    else if (contractualisation === "VA") {

        couleur = "#10df08";

    }

    return {

        fillColor: couleur,

        fillOpacity: 0.65,

        color: "#b6b6b6",

        weight: 1

    };

}

/* =========================================
   POINT AU CENTRE DES COMMUNES INTERESSEES
   ========================================= */

function styleCommunes_points(feature) {

    const code = String(
        feature.properties.INSEE_COMM || ""
    ).trim();

    const interessee =
        String(communesInteressees[code] || "").trim().toUpperCase();

    if (interessee === "X") {

        return {
            radius: 5,
            color: "#ff0000",
            weight: 2,
            fillColor: "#ff0000",
            fillOpacity: 1
        };

    }

    return {
        radius: 0,
        color: "#ffffff",
        weight: 0,
        fillColor: "#ffffff",
        fillOpacity: 0
    };
}


/* =========================================
 COUCHE COMMUNES
 ========================================= */

fetch(urlCommunes)
.then(function(response) {
 return response.json();
})
.then(function(data) {

 coucheCommunes = L.geoJSON(data, {

 style: styleCommune,
pane: "communesPane" 

    }).addTo(map);


});


/* =========================================
   POINTS DES COMMUNES
   ========================================= */

fetch(urlCommunesPoints)

.then(function(response) {

    return response.json();

})

.then(function(data) {

    communesPoints = L.geoJSON(data, {

        pointToLayer: function(feature, latlng) {

            const nom = feature.properties.NOM_COMM || "";

         /* Création du point */
const point = L.circleMarker(
    latlng,
    {
        ...styleCommunes_points(feature),
        pane: "communesPointsPane"
    }
);

            /* Étiquette de la commune */
            point.bindTooltip(nom, {

                permanent: true,

                direction: "center",

                className: "labelCommune",

                offset: [0, 0],

                interactive: false,
	     pane: "communesLabelsPane" 

            });

            return point;

        }

    });

/* Les points sont toujours visibles */
communesPoints.addTo(map); 



    /*
       Affichage des noms uniquement à partir
       du zoom 10
    */
    gererEtiquettesCommunes();

});


/* =========================================
   AFFICHAGE DES ÉTIQUETTES À PARTIR DU ZOOM 10
   ========================================= */

function gererEtiquettesCommunes() {

    if (!communesPoints) {
        return;
    }

    communesPoints.eachLayer(function(layer) {

        if (map.getZoom() >= 10) {

            layer.openTooltip();

        } else {

            layer.closeTooltip();

        }

    });

}


/* =========================================
   ACTUALISATION DES ÉTIQUETTES AU CHANGEMENT
   DE ZOOM
   ========================================= */

map.on("zoomend", gererEtiquettesCommunes);
/* =========================================
 ARRONDISSEMENTS
 ========================================= */


fetch(urlArrondissements)
.then(function(response) {
 return response.json();
})
.then(function(data) {

 coucheArrondissements = L.geoJSON(data, {
pane: "arrondissementPane", 
        style: {
            color: "#141f72",
            weight: 3,
            fill: false
        }
    });

    coucheArrondissements.addTo(map);



    /* =========================================
       BOUTONS DE ZOOM
       ========================================= */

    const limitesArrondissements = {};


    /* On récupère l'emprise de chaque arrondissement
       grâce à INSEE_ARR */

    data.features.forEach(function(feature) {

        const code = String(
            feature.properties.INSEE_ARR || ""
        ).trim();

        const couche = L.geoJSON(feature);

        if (code === "1") {
            limitesArrondissements.avranches =
                couche.getBounds();
        }

        else if (code === "2") {
            limitesArrondissements.cherbourg =
                couche.getBounds();
        }

        else if (code === "3") {
            limitesArrondissements.coutances =
                couche.getBounds();
        }

        else if (code === "4") {
            limitesArrondissements.saintlo =
                couche.getBounds();
        }

    });


    /* =========================================
       MANCHE
       ========================================= */

    document.getElementById("zoomManche")
        .addEventListener("click", function() {

            map.fitBounds(
                coucheArrondissements.getBounds(),
                {
                    padding: [5, 5]
                }
            );

        });


    /* =========================================
       AVRANCHES
       ========================================= */

    document.getElementById("zoomAvranches")
        .addEventListener("click", function() {

            if (limitesArrondissements.avranches) {

                map.fitBounds(
                    limitesArrondissements.avranches,
                    {
                        padding: [5, 5]
                    }
                );

            }

        });


    /* =========================================
       CHERBOURG
       ========================================= */

    document.getElementById("zoomCherbourg")
        .addEventListener("click", function() {

            if (limitesArrondissements.cherbourg) {

                map.fitBounds(
                    limitesArrondissements.cherbourg,
                    {
                        padding: [5, 5]
                    }
                );

            }

        });


    /* =========================================
       COUTANCES
       ========================================= */

    document.getElementById("zoomCoutances")
        .addEventListener("click", function() {

            if (limitesArrondissements.coutances) {

                map.fitBounds(
                    limitesArrondissements.coutances,
                    {
                        padding: [5, 5]
                    }
                );

            }

        });


    /* =========================================
       SAINT-LÔ
       ========================================= */

    document.getElementById("zoomSaintLo")
        .addEventListener("click", function() {

            if (limitesArrondissements.saintlo) {

                map.fitBounds(
                    limitesArrondissements.saintlo,
                    {
                        padding: [5, 5]
                    }
                );

            }

        });

});

</script>

</body>

</html>
