<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Carte des intentions de contractualisations</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100%;
}

.labelCommune {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    color: #555555;
    font-size: 8px;
    font-weight: normal;
    white-space: nowrap;
    padding: 0;
    text-align: center;
    line-height: 20px;
    pointer-events: none;
}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<script>

grist.ready({
    requiredAccess: "read table"
});


/* =========================================
   GEOJSON
   ========================================= */

const urlCommunes =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/communes.geojson";

const urlArrondissements =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/arrondissement.geojson";

const urlCommunesPoints =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/communes_points.geojson";


/* =========================================
   CARTE
   ========================================= */

const map = L.map("map", {
    center: [49.1, -1.3],
    zoom: 8
});

/* =========================================
   PANES
   ========================================= */

map.createPane("communesPane");
map.getPane("communesPane").style.zIndex = 400;

map.createPane("arrondissementPane");
map.getPane("arrondissementPane").style.zIndex = 500;




/* =========================================
   DONNÉES GRIST
   ========================================= */

let contractualisationParCommune = {};
let coucheCommunes = null;


/* =========================================
   TEST DES DONNÉES GRIST
   ========================================= */

console.log("TEST API GRIST :", typeof grist);

grist.onRecords(function(records) {

    console.log("NOMBRE DE LIGNES GRIST :", records.length);

    contractualisationParCommune = {};

    records.forEach(function(record) {

        const code = String(record["Code_Commune"] || "").trim();

        const valeur = String(record["Contractualisation"] || "").trim();

        if (code) {

            contractualisationParCommune[code] = valeur;

        }

    });

    console.log(
        "TABLEAU DES CONTRACTUALISATIONS :",
        contractualisationParCommune
    );

    if (coucheCommunes) {

        coucheCommunes.setStyle(styleCommune);

    }

});

/* =========================================
COLORATION DES COMMUNES
   ========================================= */

function styleCommune(feature) {

    const code = String(
        feature.properties.INSEE_COMM || ""
    ).trim();

    const contractualisation =
        contractualisationParCommune[code] || "";

    let couleur = "#ffffff";

    if (contractualisation === "PVD") {

        couleur = "#9842b7";

    }
    else if (contractualisation === "ACV") {

        couleur = "#ff9a3b";

    }
    else if (contractualisation === "VA") {

        couleur = "#10df08";

    }

    return {

        fillColor: couleur,

        fillOpacity: 0.65,

        color: "#b6b6b6",

        weight: 1

    };

}

/* =========================================
   COUCHE COMMUNES
   ========================================= */

fetch(urlCommunes)

.then(function(response) {

    return response.json();

})

.then(function(data) {

    coucheCommunes = L.geoJSON(data, {

          pane: "communesPane", 
	style: styleCommune

    }).addTo(map);

});


/* =========================================
   POINTS DES COMMUNES
   ========================================= */

fetch(urlCommunesPoints)

.then(function(response) {

    return response.json();

})

.then(function(data) {

    const communesPoints = L.geoJSON(data, {

        pointToLayer: function(feature, latlng) {

            const nom = feature.properties.NOM_COMM || "";

            return L.marker(latlng, {

                interactive: false,

                icon: L.divIcon({

                    className: "labelCommune",

                    html: nom,

                    iconSize: [120, 20],

                    iconAnchor: [60, 10]

                })

            });

        }

    });


    /* =========================================
       AFFICHAGE DES ÉTIQUETTES À PARTIR DU ZOOM 11
       ========================================= */

    function gererEtiquettesCommunes() {

        if (map.getZoom() >= 11) {

            communesPoints.addTo(map);

        } else {

            map.removeLayer(communesPoints);

        }

    }

    map.on("zoomend", gererEtiquettesCommunes);

    gererEtiquettesCommunes();

});


/* =========================================
   ARRONDISSEMENTS
   ========================================= */

fetch(urlArrondissements)

.then(function(response) {

    return response.json();

})

.then(function(data) {

const arrondissements = L.geoJSON(data, {

    pane: "arrondissementPane",

    style: {

        color: "#141f72",
        weight: 3,
        fill: false

    }

});

    arrondissements.addTo(map);

});

</script>

</body>

</html>
