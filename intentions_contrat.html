<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Carte des intentions de contractualisations</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100%;
}

.labelCommune {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    color: #555555;
    font-size: 8px;
    font-weight: normal;
    white-space: nowrap;
    padding: 0;
    text-align: center;
    line-height: 20px;
    pointer-events: none;
}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<script>

grist.ready({
    requiredAccess: "read table"
});


/* =========================================
   GEOJSON
   ========================================= */

const urlCommunes =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/communes.geojson";

const urlArrondissements =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/arrondissement.geojson";

const urlCommunesPoints =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/communes_points.geojson";


/* =========================================
   CARTE ET PANE
   ========================================= */

const map = L.map("map", {
    center: [49.1, -1.3],
    zoom: 8
});

map.createPane("arrondissementPane");
map.getPane("arrondissementPane").style.zIndex = 650;

map.createPane("interesseesPane");
map.getPane("interesseesPane").style.zIndex = 640;



/* =========================================
   DONNÉES GRIST
   ========================================= */

let contractualisationParCommune = {};
let communesInteressees = {};
let coucheCommunes = null;
let coucheCommunesInteressees = null;

/* =========================================
   TEST DES DONNÉES GRIST
   ========================================= */

console.log("TEST API GRIST :", typeof grist);

grist.onRecords(function(records) {

    console.log("NOMBRE DE LIGNES GRIST :", records.length);

    contractualisationParCommune = {};

    communesInteressees= {};

    records.forEach(function(record) {

        const code = String(
            record["Code_Commune"] || ""
        ).trim();

        const valeur = String(
            record["Contractualisation"] || ""
        ).trim();

        const comminteressees = String(
            record["Communes_interessees"] || ""
        ).trim().toUpperCase();

        if (code) {

            contractualisationParCommune[code] = valeur;

            communesInteressees[code] = comminteressees;

        }

    });

    console.log(
        "TABLEAU DES CONTRACTUALISATIONS :",
        contractualisationParCommune
    );

    console.log(
        "TABLEAU COMMUNES INTERESSEES :",
         communesInteressees
    );

if (coucheCommunes) {

    coucheCommunes.setStyle(styleCommune);

}

if (coucheCommunesInteressees) {

    coucheCommunesInteressees.setStyle(function(feature) {

        const code = String(
            feature.properties.INSEE_COMM || ""
        ).trim();

        const interessees =
            communesInteressees[code] || "";

        if (interessees === "X") {

            return {
                fill: false,
                color: "#ff0000",
                weight: 3
            };

        }

        return {
            fill: false,
            color: "transparent",
            weight: 0
        };

    });

}

});

/* =========================================
COLORATION DES COMMUNES
   ========================================= */

function styleCommune(feature) {

    const code = String(
        feature.properties.INSEE_COMM || ""
    ).trim();

    const contractualisation =
        contractualisationParCommune[code] || "";

    const comminteressees =
        communesInteressees[code] || "";

    let couleur = "#ffffff";

    if (contractualisation === "PVD") {

        couleur = "#9842b7";

    }

    else if (contractualisation === "ACV") {

        couleur = "#ff9a3b";

    }

    else if (contractualisation === "VA") {

        couleur = "#10df08";

    }

    /* =========================================
       CONTOUR COMMUNES INTERESSEES
       ========================================= */

    let couleurContour = "#b6b6b6";

    let epaisseurContour = 1;

    if (comminteressees === "X") {

        couleurContour = "#ff0000";

        epaisseurContour = 2;

    }

    return {

        fillColor: couleur,

        fillOpacity: 0.65,

        color: couleurContour,

        weight: epaisseurContour

    };

}

/* =========================================
   COUCHE COMMUNES
   ========================================= */

fetch(urlCommunes)
.then(function(response) {
    return response.json();
})
.then(function(data) {

    /* =========================================
       COMMUNES
       ========================================= */

    coucheCommunes = L.geoJSON(data, {
        style: styleCommune
    }).addTo(map);


    /* =========================================
       CONTOURS ROUGES DES COMMUNES INTÉRESSÉES
       ========================================= */

    coucheCommunesInteressees = L.geoJSON(data, {

        pane: "interesseesPane",

        style: function(feature) {

            const code = String(
                feature.properties.INSEE_COMM || ""
            ).trim();

            const interessees =
                communesInteressees[code] || "";

            if (interessees === "X") {

                return {
                    fill: false,
                    color: "#ff0000",
                    weight: 3
                };

            }

            return {
                fill: false,
                color: "transparent",
                weight: 0
            };

        }

    }).addTo(map);

});


/* =========================================
   POINTS DES COMMUNES
   ========================================= */

fetch(urlCommunesPoints)

.then(function(response) {

    return response.json();

})

.then(function(data) {

    const communesPoints = L.geoJSON(data, {

        pointToLayer: function(feature, latlng) {

            const nom = feature.properties.NOM_COMM || "";

            return L.marker(latlng, {

                interactive: false,

                icon: L.divIcon({

                    className: "labelCommune",

                    html: nom,

                    iconSize: [120, 20],

                    iconAnchor: [60, 10]

                })

            });

        }

    });



    /* =========================================
       AFFICHAGE DES ÉTIQUETTES À PARTIR DU ZOOM 11
       ========================================= */

    function gererEtiquettesCommunes() {

        if (map.getZoom() >= 11) {

            communesPoints.addTo(map);

        } else {

            map.removeLayer(communesPoints);

        }

    }

    map.on("zoomend", gererEtiquettesCommunes);

    gererEtiquettesCommunes();

});


/* =========================================
   ARRONDISSEMENTS
   ========================================= */

fetch(urlArrondissements)

.then(function(response) {

    return response.json();

})

.then(function(data) {

const arrondissements = L.geoJSON(data, {
pane: "arrondissementPane", 

    style: {

        color: "#141f72",
        weight: 3,
        fill: false

    }

});

arrondissements.addTo(map);

arrondissements.bringToFront();

});

</script>

</body>

</html>
