```html
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>CartoGrist - Intentions pour contractualiser</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* ======================================
   PAGE
   ====================================== */

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100%;
}


/* ======================================
   LEGENDE
   ====================================== */

.legend {
    background: white;
    padding: 10px 12px;
    border-radius: 6px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.35);
    font-size: 13px;
    line-height: 22px;
}

.legend-title {
    font-weight: bold;
    margin-bottom: 5px;
}

.legend-item {
    display: flex;
    align-items: center;
    margin: 3px 0;
}

.legend-symbol {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    margin-right: 7px;
    border: 1px solid #555;
}


/* ======================================
   POPUP
   ====================================== */

.popup-title {
    font-weight: bold;
    font-size: 15px;
    color: #1f5fae;
    margin-bottom: 7px;
}

.popup-row {
    margin-bottom: 4px;
}

</style>

</head>


<body>

<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>


<script>

/* =====================================================
   1 — CONFIGURATION
   ===================================================== */


/* -------------------------------------
   GeoJSON des communes
   ------------------------------------- */

/*
   IMPORTANT :
   On utilise ici l'URL RAW de GitHub.

   Ton fichier est actuellement ici :

   https://github.com/setrisgc/CartoGristDT/blob/main/communes.geojson

   L'URL utilisée par fetch() doit être :

   https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/communes.geojson
*/

const urlCommunes =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/communes.geojson";


/* -------------------------------------
   Couleurs contractualisation
   ------------------------------------- */

const couleurs = {

    ACV: "#ff9a3b",

    PVD: "#9842b7",

    VA: "#10df08"

};


/* =====================================================
   2 — CREATION DE LA CARTE
   ===================================================== */

const fondIGN = L.tileLayer(
    "https://data.geopf.fr/wmts?" +
    "SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0" +
    "&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2" +
    "&STYLE=normal" +
    "&TILEMATRIXSET=PM" +
    "&TILEMATRIX={z}" +
    "&TILEROW={y}" +
    "&TILECOL={x}" +
    "&FORMAT=image/jpeg",
    {
        maxZoom: 22,
        maxNativeZoom: 19,
        attribution: "© IGN"
    }
);


const map = L.map("map", {

    center: [49.1, -1.3],

    zoom: 9,

    layers: [fondIGN]

});


/* =====================================================
   3 — COUCHE DES COMMUNES
   ===================================================== */

const coucheCommunes =
    L.layerGroup().addTo(map);


/* =====================================================
   4 — LEGENDE
   ===================================================== */

const controleLegende =
    L.control({
        position: "topright"
    });


controleLegende.onAdd =
function() {

    const div =
        L.DomUtil.create(
            "div",
            "legend"
        );


    div.innerHTML = `

        <div class="legend-title">
            Intentions pour contractualiser
        </div>


        <div class="legend-item">

            <div
                class="legend-symbol"
                style="
                    background:#ff9a3b;
                ">
            </div>

            ACV

        </div>


        <div class="legend-item">

            <div
                class="legend-symbol"
                style="
                    background:#9842b7;
                ">
            </div>

            PVD

        </div>


        <div class="legend-item">

            <div
                class="legend-symbol"
                style="
                    background:#10df08;
                ">
            </div>

            VA

        </div>

    `;

    return div;

};


controleLegende.addTo(map);


/* =====================================================
   5 — VARIABLES POUR LES DONNEES GRIST
   ===================================================== */


/*
   Cette variable contiendra les données de la table
   Intentions_pour_contractualiser.
*/

let donneesGrist = {};


/*
   Fonction qui construit un dictionnaire :

   Code commune
          ↓
   Contractualisation

   Exemple :

   "50001" → "ACV"
   "50002" → "PVD"
   "50003" → "VA"
*/

function construireDonneesGrist(records) {

    donneesGrist = {};


    records.forEach(record => {

        const code =
            record["Code commune"];


        const contractualisation =
            record["Contractualisation"];


        if (
            code !== null &&
            code !== undefined &&
            String(code).trim() !== ""
        ) {

            const codeINSEE =
                String(code).trim();


            const valeur =
                contractualisation
                ? String(
                    contractualisation
                  ).trim().toUpperCase()
                : "";


            donneesGrist[codeINSEE] =
                valeur;

        }

    });


    console.log(
        "Données Grist :",
        donneesGrist
    );

}


/* =====================================================
   6 — INITIALISATION GRIST
   ===================================================== */


/*
   On demande à Grist les deux colonnes
   dont nous avons besoin.
*/

grist.ready({

    requiredAccess: "read table",

    columns: [

        "Code commune",

        "Contractualisation"

    ]

});


/* =====================================================
   7 — RECEPTION DES DONNEES GRIST
   ===================================================== */

grist.onRecords(function(records) {

    console.log(
        "Nombre de lignes Grist :",
        records.length
    );


    construireDonneesGrist(records);


    /*
       Une fois les données Grist récupérées,
       on charge le GeoJSON.
    */

    chargerCommunes();

});


/* =====================================================
   8 — CHARGEMENT DU GEOJSON
   ===================================================== */

function chargerCommunes() {


    /*
       On évite de créer plusieurs couches
       si Grist renvoie plusieurs fois les données.
    */

    coucheCommunes.clear();


    fetch(urlCommunes)

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Impossible de charger le GeoJSON : "
                + response.status
            );

        }

        return response.json();

    })


    .then(geojson => {


        console.log(
            "GeoJSON chargé :",
            geojson
        );


        /* =================================================
           9 — CREATION DE LA COUCHE COMMUNES
           ================================================= */

        const couche =
            L.geoJSON(
                geojson,
                {


                    /* ======================================
                       STYLE
                       ====================================== */

                    style:
                    function(feature) {


                        /*
                           Code INSEE du GeoJSON
                        */

                        const codeINSEE =
                            feature.properties.INSEE_COMM
                            !== undefined
                            && feature.properties.INSEE_COMM
                            !== null
                            ? String(
                                feature.properties.INSEE_COMM
                              ).trim()
                            : "";


                        /*
                           On récupère la contractualisation
                           correspondant au code INSEE.
                        */

                        const contractualisation =
                            donneesGrist[
                                codeINSEE
                            ] || "";


                        /*
                           Couleur correspondante
                        */

                        const couleur =
                            couleurs[
                                contractualisation
                            ];


                        /*
                           Si ACV / PVD / VA :
                           on colore.

                           Sinon :
                           aucune coloration.
                        */

                        if (couleur) {

                            return {

                                color: couleur,

                                weight: 2,

                                fillColor: couleur,

                                fillOpacity: 0.45

                            };

                        }


                        /*
                           Commune sans contractualisation
                        */

                        return {

                            color: "#b6b6b6",

                            weight: 1,

                            fillColor: "#ffffff",

                            fillOpacity: 0

                        };

                    },


                    /* ======================================
                       INTERACTIONS
                       ====================================== */

                    onEachFeature:
                    function(feature, layer) {


                        /*
                           Code INSEE
                        */

                        const codeINSEE =
                            feature.properties.INSEE_COMM
                            !== undefined
                            && feature.properties.INSEE_COMM !== null
                            ? String(
                                feature.properties.INSEE_COMM
                              ).trim()
                            : "";


                        /*
                           Nom commune
                        */

                        const nomCommune =
                            feature.properties.NOM_COMM
                            || feature.properties.NOM
                            || "Commune";


                        /*
                           Contractualisation
                        */

                        const contractualisation =
                            donneesGrist[
                                codeINSEE
                            ] || "";


                        /* ==================================
                           POPUP
                           ================================== */

                        let texteContractualisation;


                        if (
                            contractualisation === "ACV"
                            ||
                            contractualisation === "PVD"
                            ||
                            contractualisation === "VA"
                        ) {

                            texteContractualisation =
                                contractualisation;

                        } else {

                            texteContractualisation =
                                "Aucune";

                        }


                        layer.bindPopup(`

                            <div class="popup-title">
                                ${nomCommune}
                            </div>

                            <div class="popup-row">
                                <b>Code INSEE :</b>
                                ${codeINSEE}
                            </div>

                            <div class="popup-row">
                                <b>Contractualisation :</b>
                                ${texteContractualisation}
                            </div>

                        `);


                        /* ==================================
                           SURVOL
                           ================================== */

                        layer.on({

                            mouseover:
                            function(e) {

                                const l =
                                    e.target;


                                l.setStyle({

                                    weight: 3,

                                    fillOpacity:
                                        contractualisation
                                        ? 0.65
                                        : 0.10

                                });


                                l.bringToFront();

                            },


                            mouseout:
                            function(e) {

                                /*
                                   On remet le style
                                   correspondant à la
                                   contractualisation.
                                */

                                const couleur =
                                    couleurs[
                                        contractualisation
                                    ];


                                if (couleur) {

                                    e.target.setStyle({

                                        color:
                                            couleur,

                                        weight: 2,

                                        fillColor:
                                            couleur,

                                        fillOpacity:
                                            0.45

                                    });

                                } else {

                                    e.target.setStyle({

                                        color:
                                            "#b6b6b6",

                                        weight: 1,

                                        fillColor:
                                            "#ffffff",

                                        fillOpacity: 0

                                    });

                                }

                            }

                        });

                    }

                }

            );


        /* ================================================
           AJOUT A LA CARTE
           ================================================ */

        coucheCommunes.addLayer(
            couche
        );


        /* ================================================
           ZOOM AUTOMATIQUE
           ================================================ */

        const limites =
            couche.getBounds();


        if (limites.isValid()) {

            map.fitBounds(
                limites,
                {
                    padding: [20, 20]
                }
            );

        }


        console.log(
            "CartoGrist chargée avec succès."
        );

    })


    .catch(error => {

        console.error(
            "Erreur CartoGrist :",
            error
        );

    });

}


/* =====================================================
   10 — MESSAGE SI GRIST NE RENVOIE AUCUNE DONNEE
   ===================================================== */

grist.onRecords(function(records) {

    if (!records || records.length === 0) {

        console.log(
            "Aucune donnée reçue de Grist."
        );

    }

});

</script>

</body>

</html>
```
