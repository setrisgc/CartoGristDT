<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Carte des intentions de contractualisations</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100%;
}


/* =========================================
   ÉTIQUETTES DES COMMUNES
   ========================================= */

.labelCommune {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    color: #555555;
    font-size: 10px;
    font-weight: normal;
    white-space: nowrap;
    padding: 0;
    transform: translate(-50%, -50%); 
}


.leaflet-marker-icon.labelCommune {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
}

</style>

</head>


<body>

<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script> 


<script>

/* =========================================
   GEOJSON
   ========================================= */

const urlCommunes =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/communes.geojson";

const urlArrondissements =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/arrondissement.geojson";


/* =========================================
   CARTE
   ========================================= */

const map = L.map("map", {

    center: [49.1, -1.3],

    zoom: 8

});


/* =========================================
   FOND IGN
   ========================================= */

const fond = L.tileLayer(
    'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&FORMAT=image/png&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}',
    {
        maxZoom: 22,
        maxNativeZoom: 19,
        opacity: 0.5,
        attribution: '© IGN - Géoplateforme'
    }
);

fond.addTo(map);


/* =========================================
   COUCHE COMMUNES
   ========================================= */





fetch(urlCommunes)

.then(function(response) {

    return response.json();

})

.then(function(data) {

    const communes = L.geoJSON(data, {

        style: {

            color: "#b6b6b6",

            weight: 1,

            fill: false

        },


        /* =====================================
           ÉTIQUETTES DES COMMUNES
           ===================================== */

        onEachFeature: function(feature, layer) {

            const nom = feature.properties.NOM_COMM;

            if (nom) {

           const pointInterieur = turf.pointOnFeature(feature);

const centre = [
    pointInterieur.geometry.coordinates[1],
    pointInterieur.geometry.coordinates[0]
];

const etiquette = L.marker(centre, {

                 icon: L.divIcon({
    className: "labelCommune",
    html: nom,
    iconSize: null,
    iconAnchor: [0, 0]
}),

                    interactive: false

                });

                layer.etiquette = etiquette;

            }

        }

    });


    communes.addTo(map);


    /* =========================================
       AFFICHAGE DES NOMS SELON LE ZOOM
       ========================================= */

    function gererEtiquettesCommunes() {

        const zoom = map.getZoom();

        communes.eachLayer(function(layer) {

            if (layer.etiquette) {

                if (zoom >= 11) {

                    layer.etiquette.addTo(map);

                } else {

                    map.removeLayer(layer.etiquette);

                }

            }

        });

    }


    /* =========================================
       SURVEILLER LE ZOOM
       ========================================= */

    map.on("zoomend", gererEtiquettesCommunes);


    /* Vérification au chargement */

    gererEtiquettesCommunes();


    /* =========================================
       UNE FOIS LES COMMUNES CHARGÉES,
       CHARGEMENT DES ARRONDISSEMENTS
       ========================================= */

    return fetch(urlArrondissements);

})


.then(function(response) {

    return response.json();

})


.then(function(data) {

    const arrondissements = L.geoJSON(data, {

        style: {

            color: "#141f72",

            weight: 3,

            fill: false

        }

    });


    /* Les arrondissements passent au-dessus */

    arrondissements.addTo(map);

});

</script>

</body>

</html>
