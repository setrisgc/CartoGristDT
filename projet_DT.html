<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Carte des intentions de contractualisations</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html, body {
 margin: 0;
 padding: 0;
 width: 100%;
 height: 100%;
}

#map {
 width: 100%;
 height: 100%;
}

.leaflet-container {
background: #ffffff !important;
} 

.labelCommune {
 background: transparent !important;
 border: none !important;
 box-shadow: none !important;
 color: #555555;
 font-size: 5px;
 font-weight: normal;
 white-space: nowrap;
 padding: 0;
 text-align: center;
 line-height: 20px;
 pointer-events: none;
}

/* =================BOITE DE ZOOM PAR DT============*/
.zoomPanel {
 background: white;
 padding: 8px;
    border-radius: 5px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.35);
    font-size: 13px;
}

.zoomPanel strong {
    display: block;
    margin-bottom: 6px;
}

.zoomPanel button {
    display: block;
    width: 120px;
    margin: 3px 0;
    padding: 4px 6px;
    border: 1px solid #cccccc;
    background: white;
    cursor: pointer;
    border-radius: 3px;
    text-align: left;
}

.zoomPanel button:hover {
    background: #eeeeee;
}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<script>

grist.ready({
    requiredAccess: "read table"
});


/* =========================================
   CHARGEMENT DES GEOJSON
   ========================================= */

const urlCommunes =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/communes.geojson";

const urlDt =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/limites_DT.geojson ";

const urlArrondissements =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/arrondissement.geojson";
const urlCommunesPoints =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/communes_points.geojson";


/* =========================================
 CARTE
 ========================================= */

const map = L.map("map", {
 center: [49.1, -1.3],
 zoom: 8
});

/* =========================================
 BOÎTE DE ZOOM PAR DT
 ========================================= */

const controleZoom = L.control({
 position: "topright"
});

controleZoom.onAdd = function() {
 const div = L.DomUtil.create("div", "zoomPanel");

 div.innerHTML = `
 <strong>📍 Zoom par DT</strong>

 <button id="zoomManche">
 Manche
 </button>

 <button id="zoomDtNord">
 DT Nord
 </button>

 <button id="zoomDtCentre">
            DT Centre
        </button>

        <button id="zoomDtSud">
            DT Sud
        </button>

    `;

    L.DomEvent.disableClickPropagation(div);

    return div;
};

controleZoom.addTo(map);


/* =========================================
   DONNÉES GRIST
   ========================================= */

let contractualisationParCommune = {};
let coucheCommunes = null;
let coucheDt = null;
let coucheArrondissements = null;


/* =========================================
 TEST DES DONNÉES GRIST
 ========================================= */

console.log("TEST API GRIST :", typeof grist);

grist.onRecords(function(records) {

 console.log("NOMBRE DE LIGNES GRIST :", records.length);

 contractualisationParCommune = {};

 records.forEach(function(record) {

 const code = String(record["Code_Commune"] || "").trim();

 const valeur = String(record["Contractualisation"] || "").trim();
if (code) {

 contractualisationParCommune[code] = valeur;

 }

    });

    console.log(
        "TABLEAU DES CONTRACTUALISATIONS :",
        contractualisationParCommune
    );

    if (coucheCommunes) {

        coucheCommunes.setStyle(styleCommune);

    }

});

/* =========================================
COLORATION DES COMMUNES
   ========================================= */

function styleCommune(feature) {

    const code = String(
        feature.properties.INSEE_COMM || ""
    ).trim();

    const contractualisation =
        contractualisationParCommune[code] || "";

    let couleur = "#ffffff";

    if (contractualisation === "PVD") {

        couleur = "#9842b7";

    }
    else if (contractualisation === "ACV") {

        couleur = "#ff9a3b";

    }
    else if (contractualisation === "VA") {

        couleur = "#10df08";

    }

    return {

        fillColor: couleur,

        fillOpacity: 0.65,

        color: "#b6b6b6",

        weight: 1

    };

}

/* =========================================
   COUCHE COMMUNES
   ========================================= */

fetch(urlCommunes)
.then(function(response) {
    return response.json();
})
.then(function(data) {

    coucheCommunes = L.geoJSON(data, {

        style: styleCommune

    }).addTo(map);

    /* Si les arrondissements et les DT sont déjà chargés,
       on les remet au-dessus des communes */
    if (coucheArrondissements) {
        coucheArrondissements.bringToFront();
    }

});

/* =========================================
LIMITES DES DT il faut demander à Leaflet d’aller chercher limites_DT.geojson, de le transformer en couche et d’afficher les limites correspondantes
   ========================================= */

fetch(urlDt)
.then(function(response) {
    return response.json();
})

.then(function(data) {
    coucheDt = L.geoJSON(data, {
        style: {
            color: "#7b3294",
            weight: 3,
            fill: false
        }

    }).addTo(map);

});






/* =========================================
   POINTS DES COMMUNES
   ========================================= */

fetch(urlCommunesPoints)

.then(function(response) {

    return response.json();

})

.then(function(data) {

    const communesPoints = L.geoJSON(data, {

        pointToLayer: function(feature, latlng) {

            const nom = feature.properties.NOM_COMM || "";

            return L.marker(latlng, {

                interactive: false,

                icon: L.divIcon({

                    className: "labelCommune",

                    html: nom,

                    iconSize: [120, 20],

                    iconAnchor: [60, 10]

                })

            });

        }

    });



    /* =========================================
       AFFICHAGE DES ÉTIQUETTES À PARTIR DU ZOOM 10
       ========================================= */

    function gererEtiquettesCommunes() {

        if (map.getZoom() >= 10) {

            communesPoints.addTo(map);

        } else {

            map.removeLayer(communesPoints);

        }

    }

    map.on("zoomend", gererEtiquettesCommunes);

    gererEtiquettesCommunes();

});


/* =========================================
   ARRONDISSEMENTS
   ========================================= */


fetch(urlArrondissements)
.then(function(response) {
    return response.json();
})
.then(function(data) {

    coucheArrondissements = L.geoJSON(data, {
        style: {
            color: "#141f72",
            weight: 3,
            fill: false
        }
    });

    coucheArrondissements.addTo(map);

/* pour remettre la couche des arrondissemenents au dessus des communes*/

    coucheArrondissements.bringToFront();


    /* =========================================
       BOUTONS DE ZOOM
       ========================================= */

    const limitesDt = {};


    /* =====On récupère l'emprise de chaque DT grâce au champ NOM====*/

    data.features.forEach(function(feature) {

        const code = String(
            feature.properties.NOM || ""
        ).trim();

        const couche = L.geoJSON(feature);

        if (code === "1") {
            limitesArrondissements.avranches =
                couche.getBounds();
        }

        else if (code === "2") {
            limitesArrondissements.cherbourg =
                couche.getBounds();
        }

        else if (code === "3") {
            limitesArrondissements.coutances =
                couche.getBounds();
        }

        else if (code === "4") {
            limitesArrondissements.saintlo =
                couche.getBounds();
        }

    });


    /* =========================================
       MANCHE
       ========================================= */

    document.getElementById("zoomManche")
        .addEventListener("click", function() {

            map.fitBounds(
                coucheArrondissements.getBounds(),
                {
                    padding: [5, 5]
                }
            );

        });


    /* =========================================
       AVRANCHES
       ========================================= */

    document.getElementById("zoomAvranches")
        .addEventListener("click", function() {

            if (limitesArrondissements.avranches) {

                map.fitBounds(
                    limitesArrondissements.avranches,
                    {
                        padding: [5, 5]
                    }
                );

            }

        });


    /* =========================================
       CHERBOURG
       ========================================= */

    document.getElementById("zoomCherbourg")
        .addEventListener("click", function() {

            if (limitesArrondissements.cherbourg) {

                map.fitBounds(
                    limitesArrondissements.cherbourg,
                    {
                        padding: [5, 5]
                    }
                );

            }

        });


    /* =========================================
       COUTANCES
       ========================================= */

    document.getElementById("zoomCoutances")
        .addEventListener("click", function() {

            if (limitesArrondissements.coutances) {

                map.fitBounds(
                    limitesArrondissements.coutances,
                    {
                        padding: [5, 5]
                    }
                );

            }

        });


    /* =========================================
       SAINT-LÔ
       ========================================= */

    document.getElementById("zoomSaintLo")
        .addEventListener("click", function() {

            if (limitesArrondissements.saintlo) {

                map.fitBounds(
                    limitesArrondissements.saintlo,
                    {
                        padding: [5, 5]
                    }
                );

            }

        });

});

</script>

</body>

</html>
