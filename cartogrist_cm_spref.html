<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<title>CartoGrist - Communes</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
}

#map{
    width:100%;
    height:100%;
}

/* Etiquettes des communes */

.labelCommune{

    background:transparent !important;
    border:none !important;
    box-shadow:none !important;

    color:#444;
    font-family:Arial, Helvetica, sans-serif;
    font-size:10px;
    font-weight:bold;

    text-shadow:
        1px 1px 2px white,
       -1px -1px 2px white,
        1px -1px 2px white,
       -1px 1px 2px white;

    pointer-events:none;
}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<script>

// ======================================
// INITIALISATION
// ======================================

const map = L.map("map",{

    zoomControl:true,
    attributionControl:false

});

// ======================================
// PANES
// ======================================

map.createPane("communesPane");
map.getPane("communesPane").style.zIndex=400;

// ======================================
// COUCHE COMMUNES
// ======================================

const coucheCommunes=L.layerGroup().addTo(map);

// ======================================
// URL DU GEOJSON
// ======================================


const urlCommunes="communes.geojson";



// ======================================
// CHARGEMENT DES COMMUNES
// ======================================

fetch(urlCommunes)

.then(response => response.json())

.then(data => {

    // Zoom sur toutes les communes
    const limites = L.geoJSON(data);
    map.fitBounds(limites.getBounds());

    // Couche des communes
    const communes = L.geoJSON(data, {

        pane: "communesPane",

        style: {
            color: "#666666",
            weight: 1,
            fillColor: "#f7f7f7",
            fillOpacity: 0.35
        },

        onEachFeature: function(feature, layer){

            layer.bindTooltip(
                feature.properties.NOM_COMM,
                {
                    permanent: true,
                    direction: "center",
                    className: "labelCommune"
                }
            );

        }

    });

    communes.addTo(coucheCommunes);

    // Affiche ou masque les étiquettes selon le zoom
    function majEtiquettes(){

        const afficher = map.getZoom() >= 11;

        document.querySelectorAll(".labelCommune").forEach(function(etiquette){

            etiquette.style.display = afficher ? "" : "none";

        });

    }

    majEtiquettes();

    map.on("zoomend", majEtiquettes);

})

.catch(function(error){

    console.log("Erreur GeoJSON :", error);

});


</script>


</body>

</html>
