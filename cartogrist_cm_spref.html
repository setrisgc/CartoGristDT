<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<title>CartoGrist - Communes</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
}

#map{
    width:100%;
    height:100%;
}

/* Etiquettes des communes */

.labelCommune{

    background:transparent !important;
    border:none !important;
    box-shadow:none !important;

    color:#444;
    font-family:Arial, Helvetica, sans-serif;
    font-size:7px;
    font-weight:bold;

    text-shadow:
        1px 1px 2px white,
       -1px -1px 2px white,
        1px -1px 2px white,
       -1px 1px 2px white;

    pointer-events:none;
}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<script>

	grist.ready({
    requiredAccess:'read table'
});









// ======================================
// INITIALISATION
// ======================================

const map = L.map("map",{

    zoomControl:true,
    attributionControl:false

});

// ======================================
// PANES ORDRE DES COUCHES
// ======================================

map.createPane("arrondissementsPane");
map.getPane("arrondissementsPane").style.zIndex=450;


map.createPane("communesPane");
map.getPane("communesPane").style.zIndex=400;


// ======================================
// FOND IGN CLASSIQUE
// ======================================

const fond = L.tileLayer(
    'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&FORMAT=image/png&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}',
    {
        maxZoom:22,
        maxNativeZoom:19,
		   opacity:0.6,
        attribution:'© IGN - Géoplateforme'
    }
);

fond.addTo(map);




// ======================================
// COUCHE COMMUNES
// ======================================

const coucheCommunes=L.layerGroup().addTo(map);






// ======================================
// URL DU GEOJSON
// ======================================


const urlCommunes="communes.geojson";

const urlArrondissements = "arrondissement.geojson";


// ======================================
// CHARGEMENT DES ARRONDISSEMENTS
// ======================================

fetch(urlArrondissements)

.then(response => response.json())

.then(data => {


    const arrondissements = L.geoJSON(data, {

        pane:"arrondissementsPane",

    interactive:false,

        style:{
            color:"#0055aa",
            weight:4,
            fillColor:"#a500a7",
            fillOpacity:0.10
        },


        onEachFeature:function(feature, layer){


            layer.bindTooltip(
                feature.properties.NOM,
                {
                    permanent:false,
                    direction:"center"
                }
            );


        }


    });


    arrondissements.addTo(map);


})

.catch(function(error){

    console.log("Erreur GeoJSON arrondissements :",error);

});


// ======================================
// COUCHE COMMUNES INTERESSEES
// ======================================

const coucheCommunesInteressees = L.layerGroup().addTo(map);


grist.onRecords(function(records){

    console.log(records[0]);

console.log("Nombre de lignes Grist :", records.length);

console.log("Valeur communes_interessees :", records.map(r => r.communes_interessees));



    coucheCommunesInteressees.clearLayers();


    records.forEach(function(record){

  console.log(
        record.Commune,
        record.communes_interessees,
        record.latitude,
        record.longitude
    );


        if(String(record.communes_interessees).toLowerCase().trim() === "oui"){


            if(record.latitude && record.longitude){


                L.circleMarker(
                    [
                        Number(record.latitude),
                        Number(record.longitude)
                    ],
                    {
                        radius:8,
                        color:"#ff0000",
                        fillColor:"#ff0000",
                        fillOpacity:0.8,
                        weight:2
                    }
                )
                .addTo(coucheCommunesInteressees);


            }

        }


    });


});



// ======================================
// CHARGEMENT DES COMMUNES
// ======================================

fetch(urlCommunes)

.then(response => response.json())

.then(data => {

    // Zoom sur toutes les communes
    const limites = L.geoJSON(data);
    map.fitBounds(limites.getBounds());

    // Couche des communes
    const communes = L.geoJSON(data, {

        pane: "communesPane",

        style: {
            color: "#666666",
            weight: 1,
            fillColor: "#f7f7f7",
            fillOpacity: 0.35
        },

        onEachFeature: function(feature, layer){

            layer.bindTooltip(
                feature.properties.NOM_COMM,
                {
                    permanent: true,
                    direction: "center",
                    className: "labelCommune"
                }
            );

        }

    });

    communes.addTo(coucheCommunes);






	
    // Affiche ou masque les étiquettes selon le zoom
    function majEtiquettes(){

        const afficher = map.getZoom() >= 11;

        document.querySelectorAll(".labelCommune").forEach(function(etiquette){

            etiquette.style.display = afficher ? "" : "none";

        });

    }

    majEtiquettes();

    map.on("zoomend", majEtiquettes);

})

.catch(function(error){

    console.log("Erreur GeoJSON :", error);

});


</script>


</body>

</html>
