<!DOCTYPE html>

<html lang="fr"> 

<head> 

<meta charset="UTF-8"> 

<title>Carte des intentions de contractualisations</title> 

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>


html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
}

#map {
 width: 100%;
 height: 100%;
}

.leaflet-container {
background: #ffffff !important;
} 

.labelCommune {
 background: transparent !important;
 border: none !important;
 box-shadow: none !important;
 color: #555555;
 font-size: 6px;
 font-weight: normal;
 white-space: nowrap;
 padding: 0;
 text-align: center;
 line-height: 20px;
 pointer-events: none;
}

.popupCommune {
 padding: 0 !important;
}

.popupCommune .leaflet-popup-content-wrapper {
    background: white;
    border: 1px solid #cccccc;
    border-radius: 6px;
}

.popupCommune .leaflet-popup-tip {
    background: white;
    border-right: 1px solid #cccccc;
    border-bottom: 1px solid #cccccc;
}

.popupCommune .titreCommune {
    background: #fff2b2;
    color: #000000;
    font-weight: bold;
    padding: 6px 10px;
    margin: -13px -20px 8px -20px;
    text-align: center;
}

.popupCommune .infosCommune {
    padding: 0 2px 2px 2px;
    line-height: 1.5;
}

.texteLong {
  margin-top: 3px;
  margin-bottom: 8px;
  line-height: 1.4;
}


/* pour la boite de zoom par arrondissement */
.zoomPanel {
    background: white;
    padding: 8px;
    border-radius: 5px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.35);
    font-size: 13px;
}

/* =========================================
   LÉGENDE DU PANNEAU
   ========================================= */

.legendeTitre {
    margin-top: 10px;
    margin-bottom: 5px;
    font-weight: bold;
    font-size: 11px;
    color: #555555;
}

.legendeCase {
    display: block;
    margin: 4px 0;
    cursor: pointer;
    font-size: 13px;
}

.legendeCase input {
    margin-right: 6px;
    cursor: pointer;
}


/* =========================================
   SOUS-CATÉGORIES
   ========================================= */

.legendeSousCategorie {
    margin-left: 24px;
    margin-top: 3px;
    font-size: 12px;
}


/* =========================================
  SYMBOLES POUR LEGENDE
   ========================================= */

.pastille {
    display: inline-block;
    width: 11px;
    height: 11px;
    margin-right: 6px;
    border-radius: 50%;
    vertical-align: -1px;
}


/* -----------------EPCI intéressées-------------------------------------*/

.pastilleEpciInteresses {
display: inline-block;
width: 14px;
height: 9px;
margin-right: 6px;
background: #fecb64;
border-radius: 1px;
vertical-align: -1px;
} 


/*------------------------------------------- suivi-------------------------------------*/
.pastilleSuiviRDV {
    background: #c6e8c0;
}

.pastilleSuiviElaboration {
    background: #70c66b;
}

.pastilleSuiviContrat {
    background: #198754;
}

.zoomPanelTitle {
    cursor: pointer;
    font-weight: bold;
    user-select: none;
}

.zoomArrow {
    display: inline-block;
    width: 14px;
}

.zoomPanelButtons {
    margin-top: 6px;
}

.zoomPanel button {
    display: block;
    width: 120px;
    margin: 3px 0 3px 20px;
    padding: 4px 6px;
    border: 1px solid #cccccc;
    background: white;
    cursor: pointer;
    border-radius: 3px;
    text-align: left;
}

.zoomPanel button:hover {
    background: #eeeeee;
}


</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<script>

grist.ready({
 requiredAccess: "read table"
});


/* =========================================
 GEOJSON
 ========================================= */

const urlCommunes =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/communes.geojson";

const urlArrondissements =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/arrondissement.geojson";

const urlCommunesPoints =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/communes_points.geojson";

const urlEpci =
"https://raw.githubusercontent.com/setrisgc/CartoGristDT/main/limites_epci.geojson ";

/* =========================================
 CARTE
 ========================================= */

const map = L.map("map", {
 center: [49.1, -1.3],
 zoom: 8
});


/* =========================================
   PANES CARTOGRAPHIQUES
   ========================================= */

map.createPane("epciInteresseesPane");
map.getPane("epciInteresseesPane").style.zIndex = 400;

map.createPane("epciSuiviVisiteContratPane"); map.getPane("epciSuiviVisiteContratPane").style.zIndex = 450; 

map.createPane("communesPane");
map.getPane("communesPane").style.zIndex = 460;

map.createPane("epciPane");
map.getPane("epciPane").style.zIndex = 470;

map.createPane("arrondissementPane");
map.getPane("arrondissementPane").style.zIndex = 500;

map.createPane("communesLabelsPane");
map.getPane("communesLabelsPane").style.zIndex = 2500;

map.createPane("popupPane");
map.getPane("popupPane").style.zIndex = 3000;


/* =========================================
 BOÎTE DE ZOOM PAR ARRONDISSEMENT
 ========================================= */

const controleZoom = L.control({
 position: "topright"
});

controleZoom.onAdd = function() {
 const div = L.DomUtil.create("div", "zoomPanel");
div.innerHTML = `

 <div class="zoomPanelTitle">
 <span class="zoomArrow">▶</span> Légende et navigation
 </div>


<div class="zoomPanelButtons">


<!-- =================================
 SUIVI EPCI
 ================================= -->

<label class="legendeCase">
 <input type="checkbox"
 id="chkSuiviVisiteContrat"
 checked>
 <span class="pastille pastilleSuivi"></span>
 Suivi du contrat
</label>

<div class="legendeSousCategorie">
 <span class="pastille pastilleSuiviRDV"></span>
 1er RDV réalisé
</div>

<div class="legendeSousCategorie">
 <span class="pastille pastilleSuiviElaboration"></span>
 Elaboration en cours
</div>

<div class="legendeSousCategorie">
 <span class="pastille pastilleSuiviContrat"></span>
 Contrat signé
</div>


 <!-- =================================
 EPCI INTÉRESSÉS
 ================================= -->

 <label class="legendeCase">
 <input type="checkbox"
 id="chkEpci_interesses"
 checked>
 <span class="pastille pastilleEpciInteresses"></span> 
 EPCI intéressés
 </label>


 <!-- =================================
 ZOOM PAR ARRONDISSEMENT
 ================================= -->

 <div class="legendeTitre">Zoom
 </div>


        <button id="zoomManche">
            Manche
        </button>

        <button id="zoomCherbourg">
            Cherbourg
        </button>

        <button id="zoomCoutances">
            Coutances
        </button>

        <button id="zoomSaintLo">
            Saint-Lô
        </button>

        <button id="zoomAvranches">
            Avranches
        </button>

    </div>
`;

    L.DomEvent.disableClickPropagation(div);

    const titre = div.querySelector(".zoomPanelTitle");
const boutons = div.querySelector(".zoomPanelButtons");

boutons.style.display = "none";


const chkSuiviVisiteContrat =
    div.querySelector("#chkSuiviVisiteContrat");

chkSuiviVisiteContrat.addEventListener("change", function() {

    if (coucheSuiviVisiteContrat) {

        if (chkSuiviVisiteContrat.checked) {

            coucheSuiviVisiteContrat.addTo(map);

        } else {

            map.removeLayer(coucheSuiviVisiteContrat);

        }

    }

});

const chkEpci_interesses =
    div.querySelector("#chkEpci_interesses");

chkEpci_interesses.addEventListener("change", function() {

    if (coucheEpciInteresses) {

        if (chkEpci_interesses.checked) {

            coucheEpciInteresses.addTo(map);

        } else {

            map.removeLayer(coucheEpciInteresses);

        }

    }

});





titre.addEventListener("click", function() {

    const fleche = titre.querySelector(".zoomArrow");

    if (boutons.style.display === "none") {

        boutons.style.display = "block";
        fleche.textContent = "▼";

    } else {

        boutons.style.display = "none";
        fleche.textContent = "▶";

    }

});

    return div;
};

controleZoom.addTo(map);

/* =========================================
 DONNÉES GRIST
 ========================================= */

let EpciInteresses = {};
let suiviVisiteContrat = {};
let informationsEpci = {};

let coucheCommunes = null;
let coucheEpci  = null;
let coucheEpciInteresses  = null;
let coucheSuiviVisiteContrat = null;
let coucheArrondissements = null;
let communesPoints = null;

/* =========================================
   LECTURE DES DONNÉES GRIST
   ========================================= */

grist.onRecords(function(records) {

    EpciInteresses = {};
    suiviVisiteContrat = {};
    informationsEpci = {};

    records.forEach(function(record) {

        const code = String(
            record["Siren_EPCI"] || ""
        ).trim();

        if (!code) return;


        /* =========================================
           EPCI INTÉRESSÉS
           ========================================= */

        EpciInteresses[code] =
            String(
                record["EPCI_interesses"] || ""
            ).trim();


        /* =========================================
           SUIVI VISITE / ÉLABORATION / CONTRAT
           ========================================= */

        suiviVisiteContrat[code] =
            String(
                record["Suivi_visite_elaboration_contrat_"] || ""
            ).trim();


        /* =========================================
           INFORMATIONS POUR LE POPUP EPCI
           ========================================= */

        informationsEpci[code] = {

            epci: String(
                record["Nom_EPCI"] || ""
            ).trim(),

            Demarche_numerique: ouiNonOuVide(
                record["Demarche_numerique"]
            ),

            Contact_sous_prefets_mail_telephone_: ouiNonOuVide(
                record["Contact_sous_prefets_mail_telephone_"]
            )

        };

    });

});



/* =========================================
STYLE DES POLYGONES DES COMMUNES contour gris
 ========================================= */

function styleCommune(feature) {

  return {
    fillColor: "#ffffff",
    fillOpacity: 0,
    color: "#959595",
    weight: 0.5
  };

}
/* =========================================
STYLE DES COMMUNES INTERESSEES
 ========================================= */

function styleEpciInteresses(feature) {

  const code = String(
    feature.properties.SIREN_EPCI || ""
  ).trim();

  const interesse =
    String(
      EpciInteresses[code] || ""
    ).trim().toUpperCase();

  if (interesse === "X") {

    return {
      fillColor: "#fecb64",
      fillOpacity: 0.8,
      color: "transparent",
      weight: 0
    };

  }

  return {
    fillColor: "#ffffff",
    fillOpacity: 0,
    color: "transparent",
    weight: 0
  };

}


/* =========================================
STYLE DU SUIVI
 ========================================= */
function styleSuiviVisiteContrat(feature) {

  const code = String(
    feature.properties.SIREN_EPCI || ""
  ).trim();

  const suivi =
    String(
      suiviVisiteContrat[code] || ""
    ).trim().toLowerCase();

  // 1er RDV réalisé
  if (suivi === "1er rdv réalisé") {
    return {
      fillColor: "#c6e8c0",
      fillOpacity: 0.8,
      color: "transparent",
      weight: 0
    };
  }

  // Elaboration en cours
  if (suivi === "elaboration en cours") {
    return {
      fillColor: "#70c66b",
      fillOpacity: 0.8,
      color: "transparent",
      weight: 0
    };
  }

  // Contrat : le mot peut être accompagné d'autres caractères
  if (suivi.includes("contrat")) {
    return {
      fillColor: "#198754",
      fillOpacity: 0.8,
      color: "transparent",
      weight: 0
    };
  }

  // Aucun suivi
  return {
    fillColor: "#ffffff",
    fillOpacity: 0,
    color: "transparent",
    weight: 0
  };
}



/* =========================================
 COUCHE COMMUNES
 ========================================= */

fetch(urlCommunes)
.then(function(response) {
 return response.json();
})
.then(function(data) {

coucheCommunes = L.geoJSON(data, {

    style: styleCommune,

    pane: "communesPane",

onEachFeature: function(feature, layer) {

    const code = String(
        feature.properties.INSEE_COMM || ""
    ).trim();

    layer.on("click", function() {

        const infos = informationsCommunes[code];

        if (!infos) {
            return;
        }



        /* =========================================
           CONTENU DU POPUP
           ========================================= */

        const contenu = `

            <div class="titreCommune">
                ${infos.commune}
            </div>

            <div class="infosCommune">

                <strong>Nom :</strong>
                ${infos.nom}<br>

                <strong>Prénom :</strong>
                ${infos.prenom}<br>

                <strong>EPCI :</strong>
                ${infos.epci}<br>

                <strong>Retour questionnaire :</strong>
                ${infos.Retour_questionnaire_29_mai}<br>

                <strong>Démarche numérique :</strong>
                ${infos.Demarche_numerique}<br>

                <strong>Contact :</strong>
${infos.Contact_sous_prefets_mail_telephone_}<br>


<strong>Observations :</strong><br>

${afficherTexteLong(
    "observations_" + code,
    infos.Observations
)}


            </div>

        `;


        /* =========================================
           OUVERTURE DU POPUP
           ========================================= */

        layer.bindPopup(contenu, {

            className: "popupCommune",

            pane: "popupPane"

        }).openPopup();

    });

}

}).addTo(map);





});


/* =========================================
 POINTS DES COMMUNES
 ========================================= */

fetch(urlCommunesPoints)

.then(function(response) {

    return response.json();

})

.then(function(data) {

    communesPoints = L.geoJSON(data, {

        pointToLayer: function(feature, latlng) {

            const nom = feature.properties.NOM_COMM || "";

         /* Création du point */
const point = L.circleMarker(
    latlng,
    {
        ...styleCommunes_points(feature),
        pane: "communesPointsPane"
    }
);

            /* Étiquette de la commune */
            point.bindTooltip(nom, {

                permanent: true,

                direction: "center",

                className: "labelCommune",

                offset: [0, 0],

                interactive: false,
	     pane: "communesLabelsPane" 

            });

            return point;

        }

    });

/* Les points sont toujours visibles */
communesPoints.addTo(map); 



    /*
       Affichage des noms uniquement à partir
       du zoom 10
    */
    gererEtiquettesCommunes();

});


/* =========================================
   AFFICHAGE DES ÉTIQUETTES À PARTIR DU ZOOM 10
   ========================================= */

function gererEtiquettesCommunes() {

    if (!communesPoints) {
        return;
    }

    communesPoints.eachLayer(function(layer) {

        if (map.getZoom() >= 10) {

            layer.openTooltip();

        } else {

            layer.closeTooltip();

        }

    });

}


/* =========================================
   ACTUALISATION DES ÉTIQUETTES AU CHANGEMENT
   DE ZOOM
   ========================================= */

map.on("zoomend", gererEtiquettesCommunes);




/* =========================================
 EPCI
 ========================================= */


/* =========================================
   EPCI
   ========================================= */

fetch(urlEpci)

.then(function(response) {

    return response.json();

})

.then(function(data) {


    /* =========================================
       CONTOURS DES EPCI
       ========================================= */

    coucheEpci = L.geoJSON(data, {

        pane: "epciPane",

        style: {

            color: "#141f72",
            weight: 3,
            fill: false

        }

    });


    coucheEpci.addTo(map);



    /* =========================================
       EPCI INTÉRESSÉS
       ========================================= */

    coucheEpciInteresses = L.geoJSON(data, {

        pane: "epciInteresseesPane",

        style: styleEpciInteresses,

        interactive: false

    });


    coucheEpciInteresses.addTo(map);

console.log(
    "Nombre d'EPCI trouvés dans Grist :",
    Object.keys(EpciInteresses).length
);



    /* =========================================
       SUIVI VISITE / ÉLABORATION / CONTRAT
       ========================================= */

    coucheSuiviVisiteContrat = L.geoJSON(data, {

        pane: "epciSuiviVisiteContratPane",

        style: styleSuiviVisiteContrat,

        interactive: false

    });


coucheSuiviVisiteContrat.addTo(map);

console.log(
    "Nombre de suivis EPCI dans Grist :",
    Object.keys(suiviVisiteContrat).length
);

});





/* =========================================
 ARRONDISSEMENTS
 ========================================= */


fetch(urlArrondissements)
.then(function(response) {
 return response.json();
})
.then(function(data) {

 coucheArrondissements = L.geoJSON(data, {
pane: "arrondissementPane", 
        style: {
            color: "#141f72",
            weight: 3,
            fill: false
        }
    });

    coucheArrondissements.addTo(map);



    /* =========================================
       BOUTONS DE ZOOM
       ========================================= */

    const limitesArrondissements = {};


    /* On récupère l'emprise de chaque arrondissement
       grâce à INSEE_ARR */

    data.features.forEach(function(feature) {

        const code = String(
            feature.properties.INSEE_ARR || ""
        ).trim();

        const couche = L.geoJSON(feature);

        if (code === "1") {
            limitesArrondissements.avranches =
                couche.getBounds();
        }

        else if (code === "2") {
            limitesArrondissements.cherbourg =
                couche.getBounds();
        }

        else if (code === "3") {
            limitesArrondissements.coutances =
                couche.getBounds();
        }

        else if (code === "4") {
            limitesArrondissements.saintlo =
                couche.getBounds();
        }

    });


    /* =========================================
       MANCHE
       ========================================= */

    document.getElementById("zoomManche")
        .addEventListener("click", function() {

            map.fitBounds(
                coucheArrondissements.getBounds(),
                {
                    padding: [5, 5]
                }
            );

        });


    /* =========================================
       AVRANCHES
       ========================================= */

    document.getElementById("zoomAvranches")
        .addEventListener("click", function() {

            if (limitesArrondissements.avranches) {

                map.fitBounds(
                    limitesArrondissements.avranches,
                    {
                        padding: [5, 5]
                    }
                );

            }

        });


    /* =========================================
       CHERBOURG
       ========================================= */

    document.getElementById("zoomCherbourg")
        .addEventListener("click", function() {

            if (limitesArrondissements.cherbourg) {

                map.fitBounds(
                    limitesArrondissements.cherbourg,
                    {
                        padding: [5, 5]
                    }
                );

            }

        });


    /* =========================================
       COUTANCES
       ========================================= */

    document.getElementById("zoomCoutances")
        .addEventListener("click", function() {

            if (limitesArrondissements.coutances) {

                map.fitBounds(
                    limitesArrondissements.coutances,
                    {
                        padding: [5, 5]
                    }
                );

            }

        });


    /* =========================================
       SAINT-LÔ
       ========================================= */

    document.getElementById("zoomSaintLo")
        .addEventListener("click", function() {

            if (limitesArrondissements.saintlo) {

                map.fitBounds(
                    limitesArrondissements.saintlo,
                    {
                        padding: [5, 5]
                    }
                );

            }

        });

});

</script>

</body>

</html>
